<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="800" viewBox="30 1710 1140 800" role="img"><title>LogiQ desktop browser — review</title><rect x="0" y="0" width="1200" height="2600" rx="0" fill="#f5f3ed" stroke="#f5f3ed" stroke-width="1" /><text x="45" y="1731" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#6551a6">03 / EXPANDED REVIEW</text><rect x="45" y="1750" width="1110" height="750" rx="12" fill="#fffefa" stroke="#242822" stroke-width="1" /><text x="63" y="1775" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#62675f">● ● ●       civic-wire.example / phone-repairs</text><rect x="1069.0" y="1758" width="70" height="28" rx="14" fill="#eee9f8" stroke="#dcded3" stroke-width="1" /><text x="1081.0" y="1779" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#6551a6">Q LogiQ</text><text x="75" y="1826" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#242822">CIVIC WIRE</text><text x="75" y="1859" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#62675f">TECHNOLOGY &amp; CONSUMER RIGHTS</text><text x="75" y="1894.0" font-family="Georgia,serif" font-size="32" font-weight="400" fill="#242822">New EU rules mean broken phones must</text><text x="75" y="1940.4" font-family="Georgia,serif" font-size="32" font-weight="400" fill="#242822">be replaced, not repaired</text><text x="75" y="1998.8" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#62675f">A circulating post claims that European repair rules leave</text><text x="75" y="2024.8999999999999" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#62675f">consumers with no choice but to buy a new phone.</text><text x="75" y="2069.0" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#62675f">“Europe has banned mobile-phone repairs,” the fictional post</text><text x="75" y="2095.1" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#62675f">claims.</text><text x="75" y="2139.2" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#62675f">It also mentions easier access to spare parts, without explaining</text><text x="75" y="2165.2999999999997" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#62675f">how that fits the headline.</text><rect x="727" y="1794" width="420" height="706" rx="0" fill="#fffefa" stroke="#dcded3" stroke-width="1" /><rect x="727" y="1794" width="420" height="54" rx="0" fill="#eee9f8" stroke="#dcded3" stroke-width="1" /><text x="743" y="1827" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#6551a6">Q  LogiQ · READING COMPANION</text><text x="1116" y="1828" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#242822">×</text><text x="745" y="1878.0" font-family="Georgia,serif" font-size="27" font-weight="400" fill="#242822">Here’s what needs a closer</text><text x="745" y="1917.15" font-family="Georgia,serif" font-size="27" font-weight="400" fill="#242822">look.</text><text x="745" y="1964.3" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#62675f">The central claim conflicts with the selected</text><text x="745" y="1986.05" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#62675f">official source.</text><rect x="741" y="2019.8" width="392" height="32" rx="5" fill="#f7e6e2" stroke="#f7e6e2" stroke-width="1" /><text x="751" y="2041.8" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#8a3434">Contradicted by this source</text><text x="745" y="2077.8" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#242822">EU rules ban mobile-phone repairs and</text><text x="745" y="2102.4500000000003" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#242822">require replacement.</text><text x="745" y="2141.1000000000004" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#242822">The Council of the EU describes measures that</text><text x="745" y="2162.8500000000004" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#242822">encourage repair, including repair requests for</text><text x="745" y="2184.6000000000004" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#242822">mobile phones.</text><rect x="741" y="2224.3500000000004" width="392" height="104" rx="6" fill="#f5f3ed" stroke="#dcded3" stroke-width="1" /><text x="753" y="2248.3500000000004" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#6551a6">SOURCE · COUNCIL OF THE EU</text><text x="753" y="2273.3500000000004" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#242822">Right to repair products · policy overview</text><text x="753" y="2311.3500000000004" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#6551a6">Open original source →</text><rect x="745" y="2344.3500000000004" width="384" height="48" rx="7" fill="#242822" stroke="#242822" stroke-width="1" /><text x="759" y="2374.3500000000004" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#fffefa">Close and keep reading →</text></svg>