<svg xmlns="http://www.w3.org/2000/svg" width="390" height="910" viewBox="795 100 390 910" role="img"><title>LogiQ mobile browser — review</title><rect x="0" y="0" width="1200" height="1100" rx="0" fill="#f5f3ed" stroke="#f5f3ed" stroke-width="1" /><text x="810" y="126" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#6551a6">03 / EXPANDED REVIEW</text><rect x="810" y="145" width="360" height="850" rx="26" fill="#fffefa" stroke="#242822" stroke-width="3" /><text x="828" y="170" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#62675f">9:41                         ▰ ▰</text><rect x="818" y="183" width="344" height="38" rx="0" fill="#f5f3ed" stroke="#dcded3" stroke-width="1" /><text x="830" y="207" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#242822">civic-wire.example</text><rect x="1084.0" y="188" width="70" height="28" rx="14" fill="#eee9f8" stroke="#dcded3" stroke-width="1" /><text x="1096.0" y="209" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#6551a6">Q LogiQ</text><rect x="818" y="221" width="344" height="732" rx="0" fill="#fffefa" stroke="#dcded3" stroke-width="1" /><rect x="818" y="221" width="344" height="54" rx="0" fill="#eee9f8" stroke="#dcded3" stroke-width="1" /><text x="834" y="254" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#6551a6">Q  LogiQ · READING COMPANION</text><text x="1131" y="255" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#242822">×</text><text x="836" y="305.0" font-family="Georgia,serif" font-size="25" font-weight="400" fill="#242822">Here’s what needs a</text><text x="836" y="341.25" font-family="Georgia,serif" font-size="25" font-weight="400" fill="#242822">closer look.</text><text x="836" y="385.5" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#62675f">The central claim conflicts with the</text><text x="836" y="407.25" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#62675f">selected official source.</text><rect x="832" y="441.0" width="316" height="32" rx="5" fill="#f7e6e2" stroke="#f7e6e2" stroke-width="1" /><text x="842" y="463.0" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#8a3434">Contradicted by this source</text><text x="836" y="499.0" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#242822">EU rules ban mobile-phone repairs</text><text x="836" y="523.65" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#242822">and require replacement.</text><text x="836" y="562.3" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#242822">The Council of the EU describes</text><text x="836" y="584.05" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#242822">measures that encourage repair,</text><text x="836" y="605.8" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#242822">including repair requests for mobile</text><text x="836" y="627.55" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#242822">phones.</text><rect x="832" y="667.3" width="316" height="132" rx="6" fill="#f5f3ed" stroke="#dcded3" stroke-width="1" /><text x="844" y="691.3" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#6551a6">SOURCE · COUNCIL OF THE EU</text><text x="844" y="716.3" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#242822">Right to repair products · policy</text><text x="844" y="738.05" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#242822">overview</text><text x="844" y="782.3" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#6551a6">Open original source →</text><rect x="836" y="815.3" width="308" height="48" rx="7" fill="#242822" stroke="#242822" stroke-width="1" /><text x="850" y="845.3" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#fffefa">Close and keep reading →<