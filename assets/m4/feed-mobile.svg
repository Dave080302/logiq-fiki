ia,serif" font-size="25" font-weight="400" fill="#242822">Here’s what needs a</text><text x="836" y="341.25" font-family="Georgia,serif" font-size="25" font-weight="400" fill="#242822">closer look.</text><text x="836" y="385.5" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#62675f">The central claim conflicts with the</text><text x="836" y="407.25" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#62675f">selected official source.</text><rect x="832" y="441.0" width="316" height="32" rx="5" fill="#f7e6e2" stroke="#f7e6e2" stroke-width="1" /><text x="842" y="463.0" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#8a3434">Contradicted by this source</text><text x="836" y="499.0" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#242822">EU rules ban mobile-phone repairs</text><text x="836" y="523.65" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#242822">and require replacement.</text><text x="836" y="562.3" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#242822">The Council of the EU describes</text><text x="836" y="584.05" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#242822">measures that encourage repair,</text><text x="836" y="605.8" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#242822">including repair requests for mobile</text><text x="836" y="627.55" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#242822">phones.</text><rect x="832" y="667.3" width="316" height="132" rx="6" fill="#f5f3ed" stroke="#dcded3" stroke-width="1" /><text x="844" y="691.3" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#6551a6">SOURCE · COUNCIL OF THE EU</text><text x="844" y="716.3" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#242822">Right to repair products · policy</text><text x="844" y="738.05" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#242822">overview</text><text x="844" y="782.3" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#6551a6">Open original source →</text><rect x="836" y="815.3" width="308" height="48" rx="7" fill="#242822" stroke="#242822" stroke-width="1" /><text x="850" y="845.3" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#fffefa">Close and keep reading →</text><rect x="818" y="955" width="344" height="32" rx="8" fill="#f5f3ed" stroke="#dcded3" stroke-width="1" /><text x="36" y="1055" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#62675f">Close or dismiss → same reading position. Reopen with the labeled LogiQ button.</text><text x="36" y="1082" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#62675f">Wireframe simulation · fictional sample story and curated evidence</text></svg>