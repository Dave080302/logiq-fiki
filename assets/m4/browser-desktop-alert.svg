<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="800" viewBox="30 910 1140 800" role="img"><title>LogiQ desktop browser — alert</title><rect x="0" y="0" width="1200" height="2600" rx="0" fill="#f5f3ed" stroke="#f5f3ed" stroke-width="1" /><text x="45" y="931" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#6551a6">02 / AUTOMATIC ALERT</text><rect x="45" y="950" width="1110" height="750" rx="12" fill="#fffefa" stroke="#242822" stroke-width="1" /><text x="63" y="975" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#62675f">● ● ●       civic-wire.example / phone-repairs</text><rect x="1069.0" y="958" width="70" height="28" rx="14" fill="#eee9f8" stroke="#dcded3" stroke-width="1" /><text x="1081.0" y="979" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#6551a6">Q LogiQ</text><text x="75" y="1026" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#242822">CIVIC WIRE</text><text x="75" y="1059" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#62675f">TECHNOLOGY &amp; CONSUMER RIGHTS</text><text x="75" y="1094.0" font-family="Georgia,serif" font-size="32" font-weight="400" fill="#242822">New EU rules mean broken phones must be replaced, not repaired</text><text x="75" y="1152.4" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#62675f">A circulating post claims that European repair rules leave consumers with no choice but to buy a new phone.</text><text x="75" y="1196.5" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#62675f">“Europe has banned mobile-phone repairs,” the fictional post claims.</text><text x="75" y="1240.6" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#62675f">It also mentions easier access to spare parts, without explaining how that fits the headline.</text><rect x="835" y="1595" width="300" height="78" rx="12" fill="#fffefa" stroke="#dcded3" stroke-width="1" /><rect x="847" y="1616" width="30" height="34" rx="8" fill="#eee9f8" stroke="#eee9f8" stroke-width="1" /><text x="855" y="1641" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#6551a6">Q</text><text x="888" y="1623" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#62675f">LogiQ</text><text x="888" y="1645.0" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#242822">A claim may be misleading.</text><text x="1112" y="1639" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#62675f">×</text></svg>