<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" role="img"><title>LogiQ reading flow: open or dismiss the notification</title><rect width="1000" height="760" fill="#f5f3ed"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#6551a6"/></marker></defs><rect x="55" y="35" width="665" height="130" rx="10" fill="#fffefa" stroke="#dcded3"/><text x="80" y="65" fill="#6551a6" font-family="Arial" font-size="17">01 / READ</text><text x="80" y="102" fill="#242822" font-family="Georgia" font-size="27">Article or social feed</text><text x="80" y="138" fill="#62675f" font-family="Arial" font-size="18">Desktop or mobile · automatic review</text><path d="M385 165V209" stroke="#6551a6" stroke-width="2" marker-end="url(#arrow)"/><rect x="55" y="215" width="665" height="130" rx="10" fill="#fffefa" stroke="#dcded3"/><text x="80" y="245" fill="#6551a6" font-family="Arial" font-size="17">02 / NOTICE</text><text x="80" y="282" fill="#242822" font-family="Georgia" font-size="27">A quiet LogiQ alert</text><text x="80" y="318" fill="#62675f" font-family="Arial" font-size="18">Open it, or dismiss and keep reading</text><path d="M385 345V389" stroke="#6551a6" stroke-width="2" marker-end="url(#arrow)"/><rect x="55" y="395" width="665" height="130" rx="10" fill="#fffefa" stroke="#dcded3"/><text x="80" y="425" fill="#6551a6" font-family="Arial" font-size="17">03 / EXPAND</text><text x="80" y="462" fill="#242822" font-family="Georgia" font-size="27">Claims, context and sources</text><text x="80" y="498" fill="#62675f" font-family="Arial" font-size="18">Source details expand in the same view</text><path d="M385 525V569" stroke="#6551a6" stroke-width="2" marker-end="url(#arrow)"/><rect x="55" y="575" width="665" height="130" rx="10" fill="#fffefa" stroke="#dcded3"/><text x="80" y="605" fill="#6551a6" font-family="Arial" font-size="17">04 / CONTINUE</text><text x="80" y="642" fill="#242822" font-family="Georgia" font-size="27">Pick up where you left off</text><text x="80" y="678" fill="#62675f" font-family="Arial" font-size="18">Use the LogiQ button to reopen the review</text><path d="M720 280H830V640H725" stroke="#6551a6" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="852" y="450" fill="#6551a6" font-family="Arial" font-size="18">Dismiss</text><text x="405" y="382" fill="#6551a6" font-family="Arial" font-size="16">Open</text><text x="405" y="562" fill="#6551a6" font-family="Arial" font-size="16">Close</text></svg>