<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img"><title>LogiQ automatic review flow</title><rect x="0" y="0" width="1100" height="650" rx="0" fill="#f5f3ed" stroke="#f5f3ed" stroke-width="1"/><text x="40" y="47" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#6551a6">A SECOND LOOK, AT YOUR PACE</text><rect x="40" y="95" width="310" height="110" rx="10" fill="#fffefa" stroke="#dcded3" stroke-width="1"/><text x="60" y="123" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#6551a6">01 / READ</text><text x="60" y="156" font-family="Georgia,serif" font-size="20" font-weight="400" fill="#242822">Browser article or social feed</text><text x="60" y="182" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#62675f">Desktop or mobile</text><rect x="410" y="95" width="300" height="110" rx="10" fill="#fffefa" stroke="#dcded3" stroke-width="1"/><text x="430" y="123" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#6551a6">02 / NOTICE</text><text x="430" y="156" font-family="Georgia,serif" font-size="20" font-weight="400" fill="#242822">Automatic branded LogiQ alert</text><text x="430" y="182" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#62675f">Open or dismiss</text><rect x="410" y="300" width="610" height="150" rx="10" fill="#fffefa" stroke="#dcded3" stroke-width="1"/><text x="430" y="328" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#6551a6">03 / EXPAND</text><text x="430" y="361" font-family="Georgia,serif" font-size="20" font-weight="400" fill="#242822">Claims, explanations and sources together</text><text x="430" y="387" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#62675f">Optional sharing stays inline</text><rect x="40" y="505" width="980" height="100" rx="10" fill="#fffefa" stroke="#dcded3" stroke-width="1"/><text x="60" y="533" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#6551a6">04 / CONTINUE</text><text x="60" y="566" font-family="Georgia,serif" font-size="20" font-weight="400" fill="#242822">Close or dismiss to resume reading</text><text x="60" y="592" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#62675f">The LogiQ ready pill can reopen the completed review</text><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#6551a6"/></marker></defs><path d="M350 150 H405" fill="none" stroke="#6551a6" stroke-width="2" marker-end="url(#arrow)"/><path d="M560 205 V295" fill="none" stroke="#6551a6" stroke-width="2" marker-end="url(#arrow)"/><path d="M410 150 H375 V480 H200 V500" fill="none" stroke="#6551a6" stroke-width="2" marker-end="url(#arrow)"/><path d="M710 450 V500" fill="none" stroke="#6551a6" stroke-width="2" marker-end="url(#arrow)"/><text x="580" y="257" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#6551a6">Tap / click</text><text x="278" y="375" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#6551a6">Dismiss</text></svg>