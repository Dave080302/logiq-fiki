<svg xmlns="http://www.w3.org/2000/svg" width="390" height="910" viewBox="405 100 390 910" role="img"><title>LogiQ mobile browser — alert</title><rect x="0" y="0" width="1200" height="1100" rx="0" fill="#f5f3ed" stroke="#f5f3ed" stroke-width="1" /><text x="420" y="126" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#6551a6">02 / AUTOMATIC ALERT</text><rect x="420" y="145" width="360" height="850" rx="26" fill="#fffefa" stroke="#242822" stroke-width="3" /><text x="438" y="170" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#62675f">9:41                         ▰ ▰</text><rect x="428" y="183" width="344" height="38" rx="0" fill="#f5f3ed" stroke="#dcded3" stroke-width="1" /><text x="440" y="207" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#242822">civic-wire.example</text><rect x="694.0" y="188" width="70" height="28" rx="14" fill="#eee9f8" stroke="#dcded3" stroke-width="1" /><text x="706.0" y="209" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#6551a6">Q LogiQ</text><text x="450" y="253" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#242822">CIVIC WIRE</text><text x="450" y="286" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#62675f">TECHNOLOGY &amp; CONSUMER RIGHTS</text><text x="450" y="321.0" font-family="Georgia,serif" font-size="27" font-weight="400" fill="#242822">New EU rules mean</text><text x="450" y="360.15" font-family="Georgia,serif" font-size="27" font-weight="400" fill="#242822">broken phones must be</text><text x="450" y="399.3" font-family="Georgia,serif" font-size="27" font-weight="400" fill="#242822">replaced, not</text><text x="450" y="438.45" font-family="Georgia,serif" font-size="27" font-weight="400" fill="#242822">repaired</text><text x="450" y="489.6" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#62675f">A circulating post claims that</text><text x="450" y="512.8000000000001" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#62675f">European repair rules leave</text><text x="450" y="536.0" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#62675f">consumers with no choice but to buy</text><text x="450" y="559.2" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#62675f">a new phone.</text><text x="450" y="600.4" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#62675f">“Europe has banned mobile-phone</text><text x="450" y="623.6" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#62675f">repairs,” the fictional post claims.</text><text x="450" y="664.8" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#62675f">It also mentions easier access to</text><text x="450" y="688.0" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#62675f">spare parts, without explaining how</text><text x="450" y="711.1999999999999" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#62675f">that fits the headline.</text><rect x="460" y="855" width="300" height="78" rx="12" fill="#fffefa" stroke="#dcded3" stroke-width="1" /><rect x="472" y="876" width="30" height="34" rx="8" fill="#eee9f8" stroke="#eee9f8" stroke-width="1" /><text x="480" y="901" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#6551a6">Q</text><text x="513" y="883" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#62675f">LogiQ</text><text x="513" y="905.0" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#242822">A claim may be misleading.</text><text x="737" y="899" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#62675f">×</text><rect x="428" y="955" width="344" height="32" rx="8" fill="#f5f3ed" stroke="#dcded3" stroke-width="1" /></svg>