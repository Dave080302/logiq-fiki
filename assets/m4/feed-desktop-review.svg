0000000004" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#242822">The Council of the EU describes measures that</text><text x="745" y="2162.8500000000004" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#242822">encourage repair, including repair requests for</text><text x="745" y="2184.6000000000004" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#242822">mobile phones.</text><rect x="741" y="2224.3500000000004" width="392" height="104" rx="6" fill="#f5f3ed" stroke="#dcded3" stroke-width="1" /><text x="753" y="2248.3500000000004" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#6551a6">SOURCE · COUNCIL OF THE EU</text><text x="753" y="2273.3500000000004" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#242822">Right to repair products · policy overview</text><text x="753" y="2311.3500000000004" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#6551a6">Open original source →</text><rect x="745" y="2344.3500000000004" width="384" height="48" rx="7" fill="#242822" stroke="#242822" stroke-width="1" /><text x="759" y="2374.3500000000004" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#fffefa">Close and keep reading →</text></svg>