<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="800" viewBox="30 110 1140 800" role="img"><title>LogiQ desktop browser — reading</title><rect x="0" y="0" width="1200" height="2600" rx="0" fill="#f5f3ed" stroke="#f5f3ed" stroke-width="1" /><text x="45" y="131" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#6551a6">01 / READING</text><rect x="45" y="150" width="1110" height="750" rx="12" fill="#fffefa" stroke="#242822" stroke-width="1" /><text x="63" y="175" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#62675f">● ● ●       civic-wire.example / phone-repairs</text><text x="75" y="226" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#242822">CIVIC WIRE</text><text x="75" y="259" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#62675f">TECHNOLOGY &amp; CONSUMER RIGHTS</text><text x="75" y="294.0" font-family="Georgia,serif" font-size="32" font-weight="400" fill="#242822">New EU rules mean broken phones must be replaced, not repaired</text><text x="75" y="352.4" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#62675f">A circulating post claims that European repair rules leave consumers with no choice but to buy a new phone.</text><text x="75" y="396.5" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#62675f">“Europe has banned mobile-phone repairs,” the fictional post claims.</text><text x="75" y="440.6" font-family="Arial,sans-serif" font-size="18" font-weight="400" fill="#62675f">It also mentions easier access to spare parts, without explaining how that fits the headline.</text></svg>