 x="741" y="2260.3500000000004" width="392" height="104" rx="6" fill="#f5f3ed" stroke="#dcded3" stroke-width="1"/><text x="753" y="2284.3500000000004" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#6551a6">SOURCE · COUNCIL OF THE EU</text><text x="753" y="2309.3500000000004" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#242822">Right to repair products · policy overview</text><text x="753" y="2347.3500000000004" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#6551a6">Open original source →</text><text x="745" y="2392.3500000000004" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#6551a6">＋ Optional: share a sourced summary</text><text x="745" y="2437.3500000000004" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#6551a6">Close and keep reading →</text><text x="36" y="2555" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#62675f">Close or dismiss → same reading position. Reopen with the LogiQ ready pill.</text><text x="36" y="2582" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#62675f">Wireframe simulation · fictional sample story and curated evidence</text></svg>