,serif" font-size="27" font-weight="400" fill="#242822">look.</text><text x="745" y="1964.3" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#62675f">The central claim conflicts with the selected</text><text x="745" y="1986.05" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#62675f">official source.</text><rect x="741" y="2019.8" width="392" height="32" rx="5" fill="#f7e6e2" stroke="#f7e6e2" stroke-width="1" /><text x="751" y="2041.8" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#8a3434">Contradicted by this source</text><text x="745" y="2077.8" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#242822">EU rules ban mobile-phone repairs and</text><text x="745" y="2102.4500000000003" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#242822">require replacement.</text><text x="745" y="2141.1000000000004" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#242822">The Council of the EU describes measures that</text><text x="745" y="2162.8500000000004" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#242822">encourage repair, including repair requests for</text><text x="745" y="2184.6000000000004" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#242822">mobile phones.</text><rect x="741" y="2224.3500000000004" width="392" height="104" rx="6" fill="#f5f3ed" stroke="#dcded3" stroke-width="1" /><text x="753" y="2248.3500000000004" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#6551a6">SOURCE · COUNCIL OF THE EU</text><text x="753" y="2273.3500000000004" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#242822">Right to repair products · policy overview</text><text x="753" y="2311.3500000000004" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#6551a6">Open original source →</text><rect x="745" y="2344.3500000000004" width="384" height="4